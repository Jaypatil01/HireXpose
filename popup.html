<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HireXpose</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            HireXpose
        </div>

        <div class="tagline">
            Expose the job before you apply.
        </div>

        <div class="status-card">

            <div class="info-title">
                CURRENT RISK
            </div>

            <div class="score">
                --
            </div>

            <div class="status">
                NOT ANALYZED
            </div>

        </div>

        <div class="info">

            <div class="info-title">
                CURRENT PAGE
            </div>

            <div class="info-text" id="pageInfo">
                Click "Analyze Job" to scan this page.
            </div>

        </div>

        <div class="info" id="redFlagsBox">

            <div class="info-title">
                DETECTION REASONS
            </div>

            <div id="redFlags">
                No analysis yet.
            </div>

        </div>

        <button id="analyzeButton">
            Analyze Job
        </button>

    </div>

    <script src="detector.js"></script>
    <script src="popup.js"></script>

</body>

</html>
